[Service]
ExecStartPre=-/usr/bin/echo Surface suspend snapshot phase=enter
ExecStartPre=-:/usr/bin/timeout 3s /usr/bin/bash -c 'exec /usr/bin/grep -Hs . /sys/class/watchdog/watchdog*/{state,bootstatus,timeout} /sys/class/power_supply/BAT*/{energy_now,power_now,voltage_now} /sys/class/thermal/thermal_zone*/temp /sys/power/suspend_stats/{failed_*,*_hw_sleep} /sys/devices/system/cpu/cpu0/cpuidle/state*/s2idle/{usage,time}'
ExecStartPre=-:/usr/bin/timeout 2s /usr/bin/bash -c 'for dev in /sys/class/wakeup/wakeup*; do if read -r count < "$dev/wakeup_count" && [[ $count =~ ^[1-9][0-9]*$ ]] && read -r name < "$dev/name"; then echo "$dev $name wakeup_count=$count"; fi; done'
ExecStopPost=-/usr/bin/echo Surface suspend snapshot phase=returned
ExecStopPost=-:/usr/bin/timeout 3s /usr/bin/bash -c 'exec /usr/bin/grep -Hs . /sys/class/watchdog/watchdog*/{state,bootstatus,timeout} /sys/class/power_supply/BAT*/{energy_now,power_now,voltage_now} /sys/class/thermal/thermal_zone*/temp /sys/power/suspend_stats/{failed_*,*_hw_sleep} /sys/devices/system/cpu/cpu0/cpuidle/state*/s2idle/{usage,time}'
ExecStopPost=-:/usr/bin/timeout 2s /usr/bin/bash -c 'for dev in /sys/class/wakeup/wakeup*; do if read -r count < "$dev/wakeup_count" && [[ $count =~ ^[1-9][0-9]*$ ]] && read -r name < "$dev/name"; then echo "$dev $name wakeup_count=$count"; fi; done'
ExecStopPost=-:/usr/bin/bash -c 'if read -r irq 2>/dev/null < /sys/power/pm_wakeup_irq && [[ $irq =~ ^[0-9]+$ ]]; then echo "First wake IRQ $irq"; /usr/bin/grep -Hs . "/sys/kernel/irq/$irq/actions"; else echo "First wake IRQ unavailable"; fi'
ExecStopPost=-/usr/bin/timeout 5s /usr/bin/journalctl --sync
